{# reporte/includes/report_buttons.html #}
{% load tz %}
{% now "Y-m-d" as today %}
{% with p=project|default:obj|default:project_obj %}
<div class="card shadow-sm mb-3 border-warning" style="border-width:2px;">
  <div class="card-header d-flex justify-content-between align-items-center bg-warning-subtle">
    <strong>📊 Reportes del proyecto</strong>
    <small class="text-muted">({{ p.name }})</small>
  </div>

  <div class="card-body d-flex flex-wrap gap-2">
    <a class="btn btn-success" href="{% url 'reporte:excel_libro_mayor' project_id=p.id %}">📒 Libro mayor</a>
    <a class="btn btn-success" href="{% url 'reporte:excel_actividades_detalle' project_id=p.id %}">📋 Actividades (detalle)</a>
    <a class="btn btn-success" href="{% url 'reporte:excel_por_estado' project_id=p.id %}?estado=E">🟡 Por estado (Ejec.)</a>
    <a class="btn btn-success" href="{% url 'reporte:excel_actividades_por_fecha' project_id=p.id %}?fecha={{ today }}&tipo=fin">📆 Por fecha fin ({{ today }})</a>
  </div>
</div>
{% endwith %}
