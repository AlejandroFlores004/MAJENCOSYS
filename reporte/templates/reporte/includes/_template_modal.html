<!-- Modal: Editar plantilla -->
<div class="modal fade" id="modalEditTpl" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar reporte guardado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="tplEditId">
        <div class="mb-3">
          <label class="form-label">Nombre del reporte</label>
          <input type="text" class="form-control" id="tplEditName" maxlength="120" />
          <div class="form-text">Máximo 120 caracteres.</div>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="tplLoadToBuilder">
          <label class="form-check-label" for="tplLoadToBuilder">
            Cargar filtros y columnas en el constructor
          </label>
        </div>

        <small class="text-muted d-block mt-2">
          * “Cargar en el constructor” no guarda todavía; solo rellena la UI para que puedas previsualizar o volver a guardar.
        </small>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnSaveTplEdit">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>
