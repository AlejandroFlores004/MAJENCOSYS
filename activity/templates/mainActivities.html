{% extends "baseMainWorkflow.html" %}

{% block title %}Actividades{% endblock title %}

{% block content %}
    {% include "partials/lists/_list_activities.html" %}

{% if messages %}
<div id="top-right-toast" class="position-fixed top-0 end-0 p-3" style="z-index:1080; min-width:280px; max-width:90vw;">
    {% for m in messages %}
    <div class="alert alert-success shadow text-center mb-2">{{ m }}</div>
    {% endfor %}
</div>
<script>
    setTimeout(() => document.getElementById('top-right-toast')?.remove(), 5000);
</script>
{% endif %}
{% endblock content %}
