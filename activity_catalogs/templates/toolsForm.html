{% extends "baseCatalogs.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{% if tool %}Editar Herramienta{% else %}Nueva Herramienta{% endif %}</h2>
    <form method="post" class="card p-3 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'activity_catalogs_home' project.id %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
