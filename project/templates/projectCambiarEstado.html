{% extends "baseMainWorkflow.html" %}
{% block title %}Cambiar estado{% endblock %}
{% block content %}
<div class="container mt-4">
  <h4 class="mb-3">Proyecto: <code>{{ p.nombre }}</code></h4>
  <div class="card shadow-sm">
    <div class="card-body">
      <p><strong>Cliente:</strong> {{ p.cliente }}</p>
      <p><strong>Estado actual:</strong> {{ p.get_estado_display }}</p>
      <form method="post">{% csrf_token %}
        <div class="d-flex justify-content-between">
          <a href="{% url 'projectDetail' p.pk %}" class="btn btn-outline-secondary">Cancelar</a>
          <button class="btn btn-primary">Cambiar estado</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
