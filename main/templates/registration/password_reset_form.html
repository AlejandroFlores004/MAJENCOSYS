<!-- registration/password_reset_form.html -->
<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <!-- Font Awesome (ICON) -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet">
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="{% static 'img/Logo.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body class="bg-light fondo-body">
    <div
      class="container vh-100 d-flex justify-content-center align-items-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header text-center"><br>
            <h3 class="text-primary text-uppercase font-weight-bold">Cambiar Contraseña</h3>
          </div>
          <div class="card-body">
            <p class="text-muted">
              Ingrese su dirección de correo electrónico y le enviaremos un
              enlace para restablecer su contraseña.
            </p>

            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label for="{{ form.email.id_for_label }}"
                  class="form-label">Email</label>
                {{ form.email }}
                {% for error in form.email.errors %}
                <div class="text-danger small">{{ error }}</div>
                {% endfor %}
              </div>

              <button type="submit" class="btn btn-primary w-100">Enviar
                Verficación</button>
            </form>

            <div class="text-center mt-3">
              <a href="{% url 'log' %}"><i class="bi bi-door-open-fill"></i>
                Regresar</a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
