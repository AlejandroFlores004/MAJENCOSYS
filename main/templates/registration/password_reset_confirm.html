<!-- registration/password_reset_confirm.html -->
<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <!-- Font Awesome (ICON) -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet">
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="{% static 'img/Logo.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body class="bg-light fondo-body">
    <div
      class="container vh-100 d-flex justify-content-center align-items-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header text-center"><br>
            <h3 class="text-primary text-uppercase font-weight-bold">Nueva Contraseña</h3>
          </div>
          <div class="card-body">
            <form method="POST">
              {% csrf_token %}

              <!-- New Password -->
              <div class="mb-3">
                <label for="{{ form.new_password1.id_for_label }}"
                  class="form-label">Ingrese nueva contraseña </label>
                {{ form.new_password1 }}
                {% if form.new_password1.errors %}
                <div class="text-danger small mt-1">
                  {{ form.new_password1.errors }}
                </div>
                {% endif %}
              </div>

              <!-- Confirm New Password -->
              <div class="mb-3">
                <label for="{{ form.new_password2.id_for_label }}"
                  class="form-label">Confirme nueva contraseña</label>
                {{ form.new_password2 }}
                {% if form.new_password2.errors %}
                <div class="text-danger small mt-1">
                  {{ form.new_password2.errors }}
                </div>
                {% endif %}
              </div>

              <button type="submit" class="btn btn-success w-100 mt-3"><i class="bi bi-key"></i> Aceptar</button>

            <div class="text-center mt-3">
              <a href="{% url 'log' %}"><i class="bi bi-door-open-fill"></i> Regresar</a>
            </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
