<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <!-- Font Awesome (ICON) -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página no encontrada</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

    <link rel="icon" type="image/jpeg" href="{% static 'img/Logo.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>

  <body class="bg-light fondo-body">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
      <div class="col-md-7">
        <div class="card shadow border-0">
          <div class="card-header text-center bg-white border-0">
            <br>
            <h3 class="text-primary text-uppercase font-weight-bold">
              Error 404 - Página no encontrada
            </h3>
          </div>

          <div class="card-body text-center">
            <p class="text-muted">
              Lo sentimos, la página que buscas no existe o ha sido movida.
            </p>

            <div class="display-1 text-primary">
              <i class="bi bi-exclamation-triangle-fill"></i>
            </div>

            <p class="mt-3 text-secondary">
              Verifica la dirección o regresa a la sección anterior.
            </p>

            <div class="mt-4">
              <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">
                <i class="bi bi-arrow-left-circle-fill"></i> Regresar
              </a>
            </div>
          </div>

          <br>
        </div>
      </div>
    </div>
  </body>
</html>
