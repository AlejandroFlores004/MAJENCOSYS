{% extends "baseMainWorkflow.html" %}

{% block title %}Cerrar sesión{% endblock title %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
    <div class="card-body text-center p-4">
      <h2 class="card-title mb-3 text-danger">Cerrar sesión</h2>
      <p class="card-text mb-4">¿Está seguro de que desea cerrar sesión?</p>
      
      <form method="post">
        {% csrf_token %}
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-danger btn-lg">Cerrar sesión</button>
          <a href="{% url 'dashboard' %}" class="btn btn-secondary btn-lg">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
