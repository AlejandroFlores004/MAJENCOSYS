{% extends "baseMainWorkflow.html" %}

{% block title %}Cerrar sesión{% endblock title %}

{% block content %}
<div class="fondo-body">
<div class="container d-flex justify-content-center align-items-center vh-85">
  <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
    <div class="card-header text-center"><br>
      <h3 class="text-danger text-uppercase font-weight-bold">Cerrar sesión</h3>
    </div>
    <div class="card-body text-center p-4">
      <p class="card-text mb-4">¿Está seguro de que desea cerrar sesión?</p>
      
      <form method="post">
        {% csrf_token %}
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-danger w-100">Cerrar sesión</button>
          <a href="{% url 'dashboard' %}" class="btn btn-primary w-100-lg"><i class="bi bi-door-open"></i>
                Regresar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
