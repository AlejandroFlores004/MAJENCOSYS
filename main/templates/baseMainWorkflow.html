<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{% endblock %}</title>

  <!-- Bootstrap 5 (si ya lo cargas en otro lado, puedes quitar estas 2 líneas) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

  <main class="container my-3">
    {# Bloque para notificaciones. Por defecto: toasts en esquina inferior-derecha #}
    {% block flash %}
      {% if messages %}
        <div class="toast-container position-fixed bottom-0 end-0 p-3 z-3" id="global-toasts">
          {% for message in messages %}
            <div class="toast align-items-center text-bg-success border-0 show" role="alert" data-bs-delay="2500">
              <div class="d-flex">
                <div class="toast-body">{{ message }}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
              </div>
            </div>
          {% endfor %}
        </div>
        <script>
          (function () {
            document.querySelectorAll('#global-toasts .toast')
              .forEach(t => new bootstrap.Toast(t).show());
          })();
        </script>
      {% endif %}
    {% endblock %}

    {# Contenido principal de cada página #}
    {% block content %}{% endblock %}
  </main>

</body>
</html>
