<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>
    <link rel="icon" type="image/jpeg" href="{% static 'img/Logo.jpg' %}">
    <link rel="stylesheet" href="{% static 'bootstrap-5.0.2-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/brand.css' %}">
    <script src="{% static 'bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js' %}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
{% if messages %}
<div class="position-fixed top-50 start-50 translate-middle p-3" style="z-index:1080;">
  {% for message in messages %}
    <div class="toast show align-items-center text-bg-{{ message.tags|default:'success' }} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">{{ message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  {% endfor %}
</div>
<script>document.querySelectorAll('.toast').forEach(t=>new bootstrap.Toast(t,{delay:2500}).show());</script>
{% endif %}

<body>
    <div class="container-fluid">
        Aquí debe ir el menu pero de la zona de trabajo
        {% block content %}
    
        {% endblock content %}
    </div>
</body>
</html>
