<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <!-- Font Awesome (ICON) -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
            rel="stylesheet">
        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
            rel="stylesheet">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock title %}</title>
        <link rel="icon" type="image/jpeg" href="{% static 'img/Logo.jpg' %}">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="{% static 'bootstrap-5.0.2-dist/css/bootstrap.min.css' %}">
        <script
            src="{% static 'bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js' %}"></script>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">

    </head>
    <body style="background-color: white;">
        <!-- Nav -->
        <div class="container-fluid p-0">
            <nav
                class="navbar navbar-expand-lg bg-light navbar-light py-3 py-lg-0 px-lg-5">
                <a href="/dashboard" class="navbar-brand ml-lg-3">
                    <h1 class="m-0 display-5 text-uppercase text-primary"><i
                            class="fa fa-wrench mr-2"></i>MAJENCO</h1>
                </a>
                <button type="button" class="navbar-toggler"
                    data-toggle="collapse" data-target="#navbarCollapse">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div
                    class="collapse navbar-collapse justify-content-between px-lg-3"
                    id="navbarCollapse">
                    <div class="navbar-nav m-auto py-0">
                        <a href="/admon_usuarios"
                            class="nav-item nav-link">USUARIOS</a>
                        <a href="/admon_project" 
                            class="nav-item nav-link">PROYECTOS</a>
                        <div class="nav-item dropdown">
                            <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown">HTA.</a>
                            <div class="dropdown-menu rounded-0 m-0">
                                <a href="/herramientas_basedatos" class="dropdown-item">BACKUP</a>
                            </div>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-secondary btn-lg dropdown-toggle d-flex align-items-center px-4 py-3 shadow-sm"
                                type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false"
                                style="min-width: 220px;">

                            <!-- User Icon -->
                            <i class="fa fa-user-circle me-2 fs-4"></i>

                            <!-- User Info -->
                            <div class="text-start">
                            <!-- Groups -->
                            <div class="fw-semibold">
                                {% for g in request.user.groups.all %}
                                {{ g.name }}{% if not forloop.last %}, {% endif %}
                                {% empty %}
                                Sin grupo
                                {% endfor %}
                            </div>

                            <!-- First Name -->
                            <small class="text-light">{{ request.user.first_name }}</small>
                            </div>
                        </button>

                        <!-- Dropdown Menu -->
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="dropdownMenuButton1">
                            <li>
                            <a class="dropdown-item d-flex align-items-center" href="{% url "infoUser" %}">
                                <i class="fa fa-info-circle me-2 text-primary"></i> Información
                            </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                            <a class="dropdown-item d-flex align-items-center text-danger" href="#">
                                <i class="fa fa-sign-out-alt me-2"></i> Cerrar Sesión
                            </a>
                            </li>
                        </ul>
                    </div>

                </div>
            </nav>
        </div>
        {% block content %}

        {% endblock content %}

        <!-- Footer -->
        <br><div
            class="container-fluid bg-dark2 text-white border-top py-4 px-sm-3 px-md-5"
            style="border-color: #3E3E4E !important;">
            <div class="row">
                <div class="col-lg-6 text-center text-md-left mb-3 mb-md-0">
                    <p class="m-0 text-white">&copy; <a
                            href="#0">MAJENCO</a>.
                        Todos los derechos reservados.
                        Diseñado por: <a href="#">UES Paracentral</a>.
                    </p>
                </div>
            </div>
        </div>
        <!-- Back to Top -->
        <a href="#" class="btn btn-lg btn-primary back-to-top"><i
                class="fa fa-angle-double-up"></i></a>

        <!-- JavaScript Navbar Responsivo -->
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script
            src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

        <!-- Javascript para el Back to Top-->
        <script src="{% static 'js/main.js' %}"></script>
    </body>
