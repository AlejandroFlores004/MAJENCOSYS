<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <!-- Font Awesome (ICON) -->
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
            rel="stylesheet">
        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
            rel="stylesheet">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock title %}</title>
        <link rel="icon" type="image/jpeg" href="{% static 'img/Logo.jpg' %}">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body style="background-color: white;">
        <!-- Contactos -->
        <div class="container-fluid bg-dark">
            <div class="row py-2 px-lg-5">
                <div class="col-lg-6 text-center text-lg-left mb-2 mb-lg-0">
                    <div
                        class="d-inline-flex align-items-center text-white">
                        <small><i class="fa fa-phone-alt mr-2"></i>+503 7674
                            7779</small>
                        <small class="px-3">|</small>
                        <small><i class="fa fa-phone-alt mr-2"></i>+503 7909
                            6893</small>
                        <small class="px-3">|</small>
                        <small><i
                                class="fa fa-envelope mr-2"></i>inversionesmajencosadec@gmail.com</small>
                    </div>
                </div>
            </div>
        </div>
        <!-- Nav -->
        <div class="container-fluid p-0">
            <nav
                class="navbar navbar-expand-lg bg-light navbar-light py-3 py-lg-0 px-lg-5">
                <h1 class="m-0 display-5 text-uppercase text-primary"><i
                        class="fa fa-wrench mr-2"></i>MAJENCO</h1>
                <button type="button" class="navbar-toggler"
                    data-toggle="collapse" data-target="#navbarCollapse">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div
                    class="collapse navbar-collapse justify-content-between px-lg-3"
                    id="navbarCollapse">
                    <div class="navbar-nav m-auto py-0">
                        <a href class="nav-item nav-link">USUARIOS</a>
                        <a href class="nav-item nav-link">2</a>
                        <a href class="nav-item nav-link">3</a>
                        <a href class="nav-item nav-link">4</a>
                    </div>
                    <a href
                        class="btn btn-primary py-2 px-4 d-none d-lg-block"><i class="fa fa-user mr-2"></i> USUARIO ACTIVO</a>
                </div>
            </nav>
        </div>
        {% block content %}

        {% endblock content %}

        <!-- Back to Top -->
        <a href="#" class="btn btn-lg btn-primary back-to-top"><i
                class="fa fa-angle-double-up"></i></a>

        <!-- JavaScript Navbar Responsivo -->
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script
            src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

        <!-- Javascript para el Back to Top-->
        <script src="{% static 'js/main.js' %}"></script>
    </body>
</html>
